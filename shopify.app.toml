# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "d552abb4e946b296879962bc6bdeac17"
name = "CDC OMS"
application_url = "http://localhost:5173"   # local frontend dev server
embedded = false

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "https://c976-2401-4900-75a8-c2da-d051-d9cd-2a69-e3bf.ngrok-free.app/webhooks/shopify/cdc-oms"
  topics = [
    "orders/create",
    "orders/updated",
    "orders/cancelled",
    "orders/fulfilled",
    "orders/paid",
    "inventory_levels/update",
    "inventory_items/create",
    "inventory_items/update",
    "inventory_items/delete",
    "fulfillments/create",
    "fulfillments/update",
    "customers/create",
    "customers/update",
    "customers/delete",
    "app/uninstalled",
    "app/scopes_update"
  ]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# One read scope per webhook domain above. Keep in sync with backend SHOPIFY_SCOPES.
scopes = "read_orders,read_customers,read_fulfillments,read_inventory,read_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://c976-2401-4900-75a8-c2da-d051-d9cd-2a69-e3bf.ngrok-free.app/shopify/cdc-oms/callback/"
]
